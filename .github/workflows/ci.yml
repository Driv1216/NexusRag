name: NexusRAG CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  offline-tests-and-build:
    name: Offline Test Suite & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend SPA
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 100% Offline Test Suite
        env:
          GOOGLE_API_KEY: "dummy_offline_key_for_ci"
          ENABLE_RERANKER_DOWNLOAD: "false"
          ENABLE_CLIP_DOWNLOAD: "false"
        run: |
          python -m unittest tests/test_offline_suite.py -v
